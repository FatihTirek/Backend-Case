services:

  # ── APPLICATION SERVER ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Dynamically maps host port to container port to prevent host port collisions
    ports:
      - "${HOST_PORT}:${PORT}"
    environment:
      # Infrastructure Networking
      DB_HOST:     ${DB_HOST}   # Points to 'postgres' locally, or cloud URI in prod
      DB_PORT:     ${DB_PORT}   # Standardized via environment
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME:     ${DB_NAME}
      PORT:        ${PORT}      # The internal port the Go web server listens on
      ENV_MODE:    ${ENV_MODE}  # e.g., 'development' or 'production'
    depends_on:
      postgres:
        condition: service_healthy
    # Production best practice: Always auto-restart unless explicitly stopped
    restart: unless-stopped

  # ── MANAGED/LOCAL DATABASE ──────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME}
    volumes:
      # Automatically initializes schema on very first boot
      # - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
      # Persists actual database binaries across container lifecycles
      - postgres_data:/var/lib/postgresql
    # Only expose database ports to the host machine in development mode
    ports:
      - "${DB_OUTSIDE_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: